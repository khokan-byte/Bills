<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f5f3">
<title>Meter Log</title>
<script>
(function(){
  var lines=[];
  window.showErr=function(m){
    lines.push(m); if(lines.length>3)lines.shift();
    function draw(){
      var d=document.getElementById('errbar');
      if(!d){d=document.createElement('div');d.id='errbar';d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;background:#b00020;color:#fff;padding:10px 12px;border-radius:10px;font:13px/1.4 monospace;z-index:120;white-space:pre-wrap;word-break:break-word';d.onclick=function(){d.remove();lines=[];};document.body.appendChild(d);}
      d.textContent=lines.join('\n')+'\n(tap to hide)';
    }
    if(document.body)draw();else document.addEventListener('DOMContentLoaded',draw);
  };
  window.addEventListener('error',function(e){window.showErr('Error: '+e.message+(e.lineno?' (line '+e.lineno+')':''));});
  window.addEventListener('unhandledrejection',function(e){window.showErr('Error: '+((e.reason&&e.reason.message)||e.reason));});
})();
try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}catch(e){}
</script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
  :root{color-scheme:light;--bg:#f5f5f3;--card:#fff;--bd:#e2e2de;--tx:#1a1a1a;--mu:#6b6b66;--in:#fff;--btn:#1a1a1a;--btnt:#fff;--sf:#f1f1ee;--err:#b00020;--ac:#378ADD;--ok:#0f7b5a;--warn:#9a5b00;--bad:#b3261e;--okb:#e3f4ed;--warnb:#fdf0dc;--badb:#fbe7e5}
  :root[data-theme=dark]{color-scheme:dark;--bg:#111113;--card:#1b1b1e;--bd:#2c2c31;--tx:#ececee;--mu:#9d9da3;--in:#232327;--btn:#ececee;--btnt:#111113;--sf:#232327;--err:#ff8a80;--ac:#6cb0f5;--ok:#5fd1a4;--warn:#f0b35a;--bad:#ff8f86;--okb:#12352a;--warnb:#3a2a10;--badb:#3d1917}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:110px}
  body{font-family:system-ui,-apple-system,sans-serif;margin:0 auto;background:var(--bg);color:var(--tx);max-width:520px;padding:0 14px 60px;line-height:1.4}
  html[lang=bn] body{line-height:1.65}
  html[lang=bn] .big{letter-spacing:0}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--bd)}
  .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .btns{display:flex;gap:8px}
  h1{font-size:20px;margin:0}
  h2{font-size:16px;margin:0 0 6px}
  header small{margin-top:2px}
  nav{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav a{flex:none;padding:6px 14px;border:1px solid var(--bd);border-radius:999px;font-size:13px;color:var(--tx);text-decoration:none;background:var(--card)}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:14px 0}
  .hero{border-color:var(--ac)}
  .big{font-size:34px;font-weight:700;letter-spacing:-.5px;margin:4px 0 2px}
  label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
  input,select,button,textarea{width:100%;min-height:44px;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--tx)}
  input[type=file]{padding:8px}
  textarea{font-family:monospace;font-size:13px}
  input:focus,select:focus,textarea:focus,button:focus-visible,nav a:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
  button{background:var(--btn);color:var(--btnt);border:none;font-weight:600;margin-top:12px;cursor:pointer}
  button:active{opacity:.85}
  button.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
  button.alt.on{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
  button.sm{width:auto;min-height:32px;padding:4px 12px;font-size:13px;margin:8px 0 0}
  button.icon{width:40px;min-height:40px;height:40px;padding:0;margin:0;border-radius:50%;background:var(--card);color:var(--tx);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center}
  button.langbtn{font-size:13px;font-weight:700}
  .sun{display:none}
  :root[data-theme=dark] .sun{display:block}
  :root[data-theme=dark] .moon{display:none}
  .blk{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:12px}
  .blk img{width:100%;max-height:160px;object-fit:cover;border-radius:10px;margin-top:8px;display:none}
  .st{font-size:12px;color:var(--mu);margin:6px 0 0}
  .ocrx{margin-top:8px}
  .err{font-size:13px;color:var(--err);margin:6px 0 0}
  .res{background:var(--sf);border-radius:10px;padding:12px;margin-top:12px;white-space:pre-line;font-size:13px;line-height:1.6}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .met{background:var(--sf);border-radius:10px;padding:12px}
  .met.hl{border:1px solid var(--ac)}
  .met small{display:block}
  .met b{font-size:22px;font-weight:600}
  .u{font-size:12px;font-weight:400;color:var(--mu)}
  .rec{border-top:1px solid var(--bd);padding:12px 0}
  .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .th{display:flex;gap:8px;margin:8px 0}
  .th img{width:64px;height:64px;object-fit:cover;border-radius:10px}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sf);color:var(--mu)}
  .pill.ok{background:var(--okb);color:var(--ok)}
  .pill.warn{background:var(--warnb);color:var(--warn)}
  .pill.bad{background:var(--badb);color:var(--bad)}
  small{color:var(--mu);font-size:12px;display:block}
  .muted{color:var(--mu);font-size:13px}
  .empty{padding:16px 0;text-align:center;color:var(--mu);font-size:14px}
  a{color:var(--ac)}
  details{margin-top:12px}
  summary{cursor:pointer;font-size:14px;font-weight:600;padding:6px 0}
  summary h2{display:inline;margin:0}
  .seg{display:flex;gap:8px}
  table.rt{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  table.rt td,table.rt th{padding:5px 3px;border-top:1px solid var(--bd);text-align:left}
  table.rt th{color:var(--mu);font-weight:500;border-top:none}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:var(--btn);color:var(--btnt);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10}
  #toast.show{opacity:1;transform:translateX(-50%)}
  #lockov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:var(--bg);color:var(--tx);display:none;align-items:center;justify-content:center;padding:20px}
  #lockov.on{display:flex}
  #lockbox{width:100%;max-width:340px;text-align:center}
  #lockbox h2{font-size:22px;margin:0 0 6px}
  #lockpin{text-align:center;font-size:26px;letter-spacing:8px;margin-top:12px}
  #cropov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:90;background:var(--bg);color:var(--tx);display:none;overflow:auto;padding:14px}
  #cropov.on{display:block}
  #cropbox{max-width:520px;margin:0 auto}
  #crcv{display:block;width:100%;border-radius:10px;touch-action:none;background:#000;margin:10px 0}
  footer.credit{text-align:center;color:var(--mu);font-size:13px;padding:24px 0 8px}
  @media print{
    .noprint,header,#toast,#errbar,footer.credit{display:none!important}
    body{background:#fff;color:#000}
    body.pr>*:not(#sec-report){display:none!important}
    body.pr #sec-report{border:none;padding:0;margin:0}
  }
</style></head>
<body>
<header class="noprint">
  <div class="top">
    <div><h1 data-i="app">Meter Log</h1><small data-i="tag"></small></div>
    <div class="btns">
      <button class="icon langbtn" id="lang" data-ia="aria_lang">বাং</button>
      <button class="icon" id="theme" data-ia="aria_theme">
        <svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
  <nav>
    <a href="#sec-dash" data-i="n_home"></a><a href="#sec-add" data-i="n_add"></a><a href="#sec-compare" data-i="n_compare"></a><a href="#sec-bills" data-i="n_bills"></a><a href="#sec-log" data-i="n_hist"></a><a href="#sec-report" data-i="n_report"></a><a href="#sec-data" data-i="n_data"></a>
  </nav>
</header>

<div class="card hero" id="sec-dash">
  <div class="head"><small data-i="d_title"></small><span id="due" class="pill">-</span></div>
  <div class="big" id="hd">-</div>
  <div class="muted" id="hp"></div>
  <div class="mets">
    <div class="met"><small data-i="d_main"></small><b id="dm">-</b></div>
    <div class="met"><small data-i="d_sub"></small><b id="ds">-</b></div>
  </div>
  <small id="hl" style="margin-top:10px"></small>
  <small data-i="d_note"></small>
</div>

<div class="card noprint" id="sec-add">
  <h2 data-i="a_title"></h2>
  <small data-i="a_hint"></small>
  <div class="blk">
    <b data-i="a_main"></b>
    <label for="p-main" data-i="a_photo"></label>
    <input id="p-main" type="file" accept="image/*" capture="environment">
    <img id="v-main" alt="">
    <label for="r-main" data-i="a_reading"></label>
    <input id="r-main" type="text" inputmode="decimal" autocomplete="off">
    <p class="st" id="s-main" data-i="a_ocr_hint"></p>
    <div class="ocrx" id="ocrx-main"></div>
  </div>
  <div class="blk">
    <b data-i="a_sub"></b>
    <label for="p-sub" data-i="a_photo"></label>
    <input id="p-sub" type="file" accept="image/*" capture="environment">
    <img id="v-sub" alt="">
    <label for="r-sub" data-i="a_reading"></label>
    <input id="r-sub" type="text" inputmode="decimal" autocomplete="off">
    <p class="st" id="s-sub" data-i="a_ocr_hint"></p>
    <div class="ocrx" id="ocrx-sub"></div>
  </div>
  <label for="note" data-i="a_note"></label>
  <input id="note" type="text" data-ip="a_note_ph">
  <p class="err" id="err"></p>
  <button id="save" data-i="a_save"></button>
</div>

<div class="card" id="sec-compare">
  <h2 data-i="c_title"></h2>
  <div class="two noprint">
    <div><label for="from" data-i="c_from"></label><select id="from"></select></div>
    <div><label for="to" data-i="c_to"></label><select id="to"></select></div>
  </div>
  <div class="noprint">
    <label for="rate" data-i="c_rate"></label>
    <input id="rate" type="text" inputmode="decimal" autocomplete="off" data-ip="c_rate_ph">
  </div>
  <div class="mets">
    <div class="met"><small data-i="c_main"></small><b id="cm">-</b></div>
    <div class="met"><small data-i="c_sub"></small><b id="cs">-</b></div>
    <div class="met hl"><small data-i="c_md"></small><b id="cg">-</b></div>
    <div class="met hl"><small data-i="c_mdp"></small><b id="cp">-</b></div>
  </div>
  <p id="detail" class="muted"></p>
  <div class="res" id="impact" style="display:none"></div>
  <div class="seg noprint">
    <button id="m-cum" class="alt on" data-i="c_cum"></button>
    <button id="m-day" class="alt" data-i="c_day"></button>
  </div>
  <small style="margin-top:10px" data-i="c_legend"></small>
  <div style="position:relative;height:210px;margin-top:6px"><canvas id="chart"></canvas></div>
  <small id="chartnote"></small>
</div>

<div class="card" id="sec-bills">
  <h2 data-i="b_title"></h2>
  <small data-i="b_sub"></small>
  <details class="noprint" id="setd">
    <summary id="setsum"></summary>
    <div class="two">
      <div><label for="set-load" data-i="b_load"></label><input id="set-load" type="text" inputmode="decimal" autocomplete="off"></div>
      <div><label for="set-rent" data-i="b_rent"></label><input id="set-rent" type="text" inputmode="decimal" autocomplete="off"></div>
    </div>
    <label for="set-vat" data-i="b_vat"></label><input id="set-vat" type="text" inputmode="decimal" autocomplete="off">
    <small style="margin-top:6px" data-i="b_setnote"></small>
  </details>
  <div class="noprint">
    <label for="b-month" data-i="b_month"></label><input id="b-month" type="text" inputmode="numeric" maxlength="7" placeholder="2026-08" autocomplete="off">
    <label for="b-units" data-i="b_units"></label><input id="b-units" type="text" inputmode="decimal" autocomplete="off">
    <label for="b-amt" data-i="b_amt"></label><input id="b-amt" type="text" inputmode="decimal" autocomplete="off">
    <label for="b-photo" data-i="b_photo"></label><input id="b-photo" type="file" accept="image/*">
    <p class="err" id="b-err"></p>
    <button id="addbill" data-i="b_add"></button>
  </div>
  <div id="bills"></div>
  <div class="res" id="best"></div>
  <details>
    <summary data-i="b_rates_t"></summary>
    <small data-i="b_rates"></small>
  </details>
</div>

<div class="card noprint" id="sec-check">
  <h2 data-i="bc_title"></h2><small data-i="bc_hint"></small>
  <label for="bc-month" data-i="bc_month"></label><input id="bc-month" type="text" inputmode="numeric" maxlength="7" placeholder="2026-06" autocomplete="off">
  <div class="two">
    <div><label for="bc-prev" data-i="bc_prev"></label><input id="bc-prev" type="text" inputmode="decimal" autocomplete="off"></div>
    <div><label for="bc-pres" data-i="bc_pres"></label><input id="bc-pres" type="text" inputmode="decimal" autocomplete="off"></div>
  </div>
  <div class="two">
    <div><label for="bc-omf" data-i="bc_omf"></label><input id="bc-omf" type="text" inputmode="decimal" autocomplete="off" placeholder="1"></div>
    <div><label for="bc-units" data-i="bc_units"></label><input id="bc-units" type="text" inputmode="decimal" autocomplete="off"></div>
  </div>
  <label for="bc-load" data-i="bc_load"></label><input id="bc-load" type="text" inputmode="decimal" autocomplete="off" placeholder="2">
  <label for="bc-elec" data-i="bc_elec"></label><input id="bc-elec" type="text" inputmode="decimal" autocomplete="off">
  <label for="bc-dem" data-i="bc_dem"></label><input id="bc-dem" type="text" inputmode="decimal" autocomplete="off">
  <label for="bc-other" data-i="bc_other"></label><input id="bc-other" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
  <label for="bc-vat" data-i="bc_vat"></label><input id="bc-vat" type="text" inputmode="decimal" autocomplete="off">
  <label for="bc-adj" data-i="bc_adj"></label><input id="bc-adj" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
  <label for="bc-pay" data-i="bc_pay"></label><input id="bc-pay" type="text" inputmode="decimal" autocomplete="off">
  <label for="bc-photo" data-i="bc_photo"></label><input id="bc-photo" type="file" accept="image/*">
  <p class="err" id="bc-err"></p>
  <div class="res" id="bc-out" style="white-space:normal;display:none"></div>
  <button id="bc-save" data-i="bc_save"></button>
</div>

<div class="card" id="sec-log">
  <h2 data-i="h_title"></h2>
  <div id="list"></div>
  <button id="more" class="alt noprint"></button>
</div>

<div class="card" id="sec-report">
  <h2 data-i="r_title"></h2>
  <div class="noprint"><label for="rm" data-i="r_month"></label><select id="rm"></select></div>
  <div id="report"></div>
  <div class="two noprint">
    <button id="rprint" class="alt" data-i="r_print"></button>
    <button id="rshare" class="alt" data-i="r_share"></button>
  </div>
</div>

<details class="card noprint" id="sec-import">
  <summary><h2 data-i="i_title"></h2></summary>
  <small data-i="i_hint"></small>
  <textarea id="paste" rows="6" data-ip="i_ph" style="margin-top:8px"></textarea>
  <button id="parse" class="alt" data-i="i_check"></button>
  <p id="pv" class="res" style="display:none"></p>
  <button id="commit" style="display:none" data-i="i_add"></button>
</details>

<div class="card noprint" id="sec-lock"></div>

<div class="card noprint" id="sec-data">
  <h2 data-i="x_title"></h2>
  <div class="two">
    <button id="csv" class="alt" data-i="x_csv"></button>
    <button id="backup" class="alt" data-i="x_backup"></button>
    <button id="restoreBtn" class="alt" data-i="x_restore"></button>
    <button id="refresh" class="alt" data-i="x_refresh"></button>
  </div>
  <button id="install" style="display:none" data-i="x_install"></button>
  <small style="margin-top:10px" data-i="x_hint"></small>
  <small id="diag" style="margin-top:8px"></small>
  <input id="restore" type="file" accept="application/json" style="display:none">
</div>

<footer class="credit noprint">made with ❤️ and ☕ even I'm angry</footer>

<div id="toast" role="status"></div>

<div id="lockov">
  <div id="lockbox">
    <h2 id="lk-h"></h2><p class="muted" id="lk-p"></p>
    <input id="lockpin" type="password" inputmode="numeric" autocomplete="off" maxlength="8">
    <p class="err" id="lk-e"></p>
    <button id="lk-go"></button><button class="alt" id="lk-cancel"></button>
    <small id="lk-forgot" style="margin-top:14px"></small>
    <button class="alt sm" id="lk-lang" style="margin-top:14px"></button>
  </div>
</div>

<div id="cropov">
  <div id="cropbox">
    <h2 id="cr-h"></h2><p class="muted" id="cr-p"></p>
    <canvas id="crcv"></canvas>
    <button id="cr-go"></button><button class="alt" id="cr-full"></button><button class="alt" id="cr-x"></button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const VERSION = 'v6';

  ocr_help: 'Drag a box tightly around the reading digits only. The app remembers this box for next time.',
  ocr_read: 'Read digits', ocr_full: 'Use the whole photo', ocr_cancel: 'Cancel', ocr_adjust: 'Adjust area',

  c_title: 'Compare', c_from: 'From', c_to: 'To', c_rate: 'Rate per unit/kWh (optional, flat)', c_rate_ph: 'e.g. 9.5',

  c_days: '{0} days', c_perday: ' · Main {0} unit/day,
